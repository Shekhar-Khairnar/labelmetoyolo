[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "labelmetoyolo"
version = "0.1.0"
description = "Convert LabelMe JSON annotations to YOLO format while keeping original file names"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["labelme", "yolo", "ultralytics", "dataset", "annotation", "computer-vision"]

[project.urls]
Homepage = "https://github.com/Shekhar-Khairnar/labelmetoyolo"

[project.scripts]
labelmetoyolo = "labelmetoyolo.cli:main"

[tool.setuptools]
packages = ["labelmetoyolo"]
